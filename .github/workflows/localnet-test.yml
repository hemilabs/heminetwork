# GitHub Actions workflow to run e2e network tests.
name: "Localnet Test"
on:
  workflow_dispatch: # Manually triggered
  # Changes to the localnet and its tests are tested with the localnet.
  pull_request:
    paths:
      - "e2e/**"
      - ".github/workflows/localnet-test.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    env:
      DOCKERFILE_NAME: ./e2e/optimism-stack.Dockerfile
      DOCKER_IMAGE_TAG: optimism-stack:latest
      # the Prysm services of the localnet are behind a compose profile
      COMPOSE_PROFILES: ${{ matrix.compose_profiles }}
      L1_CONSENSUS: ${{ matrix.l1_consensus }}
    strategy:
      # the configurations are independent, let each of them finish
      fail-fast: false
      matrix:
        go-version: [ "1.26.x" ]
        proposer_mode: ["l2oo", "fault"]
        gethl1:
          # the release that Sepolia runs through the Glamsterdam activation
          - "ethereum/client-go:v1.17.7@sha256:6e9669cca5359cdb2c5571198d51e78fc18128b56bff50a1f8422d1c2946fd64"
        # dev: geth simulates the consensus layer; prysm: a Prysm beacon node
        # and validator drive geth, see e2e/prysm
        l1_consensus: ["dev"]
        include:
          # op-batcher publishes batches as blobs with one proposer mode and
          # as calldata with the other, so that both are tested without
          # doubling the number of jobs.
          - proposer_mode: "l2oo"
            batcher_da: "blobs"
          - proposer_mode: "fault"
            batcher_da: "calldata"
          # The production combination (L2OutputOracle, blobs) once more on
          # an L1 with a real Prysm consensus layer: real slots, finality and
          # Beacon API, and the Gloas fork together with Amsterdam.  Its
          # Glamsterdam activation is 6 epochs of 96 seconds after genesis.
          - go-version: "1.26.x"
            proposer_mode: "l2oo"
            gethl1: "ethereum/client-go:v1.17.7@sha256:6e9669cca5359cdb2c5571198d51e78fc18128b56bff50a1f8422d1c2946fd64"
            l1_consensus: "prysm"
            batcher_da: "blobs"
            compose_profiles: "prysm"
            l1_amsterdam_offset: "576"
            op_node_l1_beacon: "http://prysm-beacon:3500"
            batcher_l1_rpc: "http://geth-l1:8545"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: generate key and addresses
        run: go run ./cmd/keygen/keygen.go -net=localnet | jq -r 'to_entries[] | "\(.key)=\(.value)"' | sed -n '2s/^private_key/POPM_BTC_PRIVATE_KEY/; 4s/^bitcoin_address/BTC_ADDRESS/; 5s/^ethereum_address/ETH_ADDRESS/; 2p; 4p; 5p' >> $GITHUB_ENV

      - name: "Calculate optimism-stack.Dockerfile hash"
        id: dockerfile-hash
        run: echo "hash=$(sha256sum $DOCKERFILE_NAME | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: "Restore cached optimism-stack image"
        id: cache-optimism-stack
        env:
          LOCALNET_OPTIMISM_STACK_CACHE_FILE: optimism-stack-image.tar.zst
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LOCALNET_OPTIMISM_STACK_CACHE_FILE }}
          key: optimism-stack-${{ steps.dockerfile-hash.outputs.hash }}

      - name: "Load cached optimism-stack image"
        env:
          OPTIMISM_STACK_CACHE_HIT: "${{ steps.cache-optimism-stack.outputs.cache-hit }}"
          LOCALNET_OPTIMISM_STACK_CACHE_FILE: optimism-stack-image.tar.zst
        if: env.OPTIMISM_STACK_CACHE_HIT == 'true'
        run: |
          echo "Loading cached optimism-stack image (Dockerfile unchanged)"
          zstd -dc $LOCALNET_OPTIMISM_STACK_CACHE_FILE | docker load

          # remove the tar.zst file to save space
          rm $LOCALNET_OPTIMISM_STACK_CACHE_FILE

          echo "Successfully loaded cached image and tagged as $DOCKER_IMAGE_TAG"

      - name: "Build optimism-stack image"
        env:
          OPTIMISM_STACK_CACHE_HIT: "${{ steps.cache-optimism-stack.outputs.cache-hit }}"
        if: env.OPTIMISM_STACK_CACHE_HIT != 'true'
        run: |
          echo "Building optimism-stack image from Dockerfile (no cache or Dockerfile changed)"
          docker build -f ./$DOCKERFILE_NAME -t $DOCKER_IMAGE_TAG .
          docker image prune -f
          docker system prune -f

      - name: "build localnet"
        env:
          OPTIMISM_STACK_CACHE_HIT: "${{ steps.cache-optimism-stack.outputs.cache-hit }}"
        run: |
          if [ "$OPTIMISM_STACK_CACHE_HIT" = "true" ]; then
            echo "Using cached $DOCKER_IMAGE_TAG image, building remaining services"
          else
            echo "Using freshly built $DOCKER_IMAGE_TAG image, building remaining services"
          fi
          docker compose -f ./e2e/docker-compose.yml build
          docker image prune -f
          docker system prune -f
      
      - name: "remove dangling"
        run: |
          docker system prune -f
          docker image prune -f

      - name: "Save optimism-stack image to cache"
        env:
          OPTIMISM_STACK_CACHE_HIT: "${{ steps.cache-optimism-stack.outputs.cache-hit }}"
          LOCALNET_OPTIMISM_STACK_CACHE_FILE: optimism-stack-image.tar.zst
        if: env.OPTIMISM_STACK_CACHE_HIT != 'true'
        run: |
          echo "Saving $DOCKER_IMAGE_TAG image to cache"
          IMAGE_ID=$(docker images -q $DOCKER_IMAGE_TAG)
          if [ -z "$IMAGE_ID" ]; then
            echo "Error: Could not find $DOCKER_IMAGE_TAG image"
            exit 1
          fi
          echo "Image ID: $IMAGE_ID"
          IMAGE_SIZE=$(docker images --format "{{.Size}}" "$IMAGE_ID")
          echo "Image size: $IMAGE_SIZE"
          docker save $DOCKER_IMAGE_TAG | zstd > $LOCALNET_OPTIMISM_STACK_CACHE_FILE
          TAR_SIZE=$(du -hs $LOCALNET_OPTIMISM_STACK_CACHE_FILE | cut -f1)
          echo "Saved compressed tarball size: $TAR_SIZE"

      # The L1 starts before Glamsterdam and activates it 7 minutes after its
      # genesis (L1_AMSTERDAM_OFFSET_SECONDS, see e2e/genesisl2.sh), when the
      # Hemi stack is up and has been deriving the L2 for a few minutes.  The
      # migration tests fail if the sequencer or the batcher were not up in
      # time; raise the offset rather than lowering it.
      - name: "run localnet"
        id: run_localnet
        env:
          LOCALNET_GETH_L1_IMAGE: ${{ matrix.gethl1 }}
          PROPOSER_MODE: ${{ matrix.proposer_mode }}
          BATCHER_DA_TYPE: ${{ matrix.batcher_da }}
          L1_AMSTERDAM_OFFSET_SECONDS: ${{ matrix.l1_amsterdam_offset || '420' }}
          OP_NODE_L1_BEACON: ${{ matrix.op_node_l1_beacon }}
          OP_NODE_FULL_SYNC_L1_BEACON: ${{ matrix.op_node_l1_beacon }}
          BATCHER_L1_RPC: ${{ matrix.batcher_l1_rpc }}
        # a Prysm L1 finalizes its first epochs a few minutes after it comes
        # up, which the late services wait for
        run: HVM_PHASE0_TIMESTAMP=$(date --date='+120 seconds' +%s) docker compose -f ./e2e/docker-compose.yml up -d --wait-timeout ${{ matrix.l1_consensus == 'prysm' && '900' || '600' }}

      - name: "remove more dangling"
        run: docker system prune -f

      - name: "build synctest"
        working-directory: ./synctest
        run: |
          docker build -t synctest:latest .
          docker image prune -f

      - name: "run synctest"
        working-directory: ./synctest
        env: 
          SYNCTESTER_CONTROL_OP_GETH_ENDPOINT: http://localhost:8546 # sequencing
          SYNCTESTER_EXPERIMENTAL_OP_GETH_ENDPOINT: http://localhost:18546 # non-sequencing
          SYNCTESTER_EXPERIMENTAL_OP_GETH_TBC_HEALTH_ENDPOINT: http://localhost:5555/health
          SYNCTESTER_NETWORK: localnet
          SYNCTESTER_SYNCMODE: snap
        run: |
          docker run \
            -e SYNCTESTER_CONTROL_OP_GETH_ENDPOINT=$SYNCTESTER_CONTROL_OP_GETH_ENDPOINT \
            -e SYNCTESTER_EXPERIMENTAL_OP_GETH_ENDPOINT=$SYNCTESTER_EXPERIMENTAL_OP_GETH_ENDPOINT \
            -e SYNCTESTER_EXPERIMENTAL_OP_GETH_TBC_HEALTH_ENDPOINT=$SYNCTESTER_EXPERIMENTAL_OP_GETH_TBC_HEALTH_ENDPOINT \
            -e SYNCTESTER_NETWORK=$SYNCTESTER_NETWORK \
            -e SYNCTESTER_SYNCMODE=$SYNCTESTER_SYNCMODE \
            -e SYNCTESTER_SKIP_DOCKER_LOGS=true \
            --network host \
            synctest:latest

      - name: "get localnet stats"
        env:
          PROPOSER_MODE: ${{ matrix.proposer_mode }}
          BATCHER_DA_TYPE: ${{ matrix.batcher_da }}
        working-directory: ./e2e/monitor
        # XXX should this be a make command?
        run: go test -timeout 30m -v .

      # These restart and reorg services, so they run after everything else.
      # They also run when the tests above failed, their log sweep shows what
      # the services complained about.
      - name: "disturb the OP stack on Glamsterdam and check its logs"
        if: ${{ !cancelled() && steps.run_localnet.outcome == 'success' }}
        env:
          PROPOSER_MODE: ${{ matrix.proposer_mode }}
          BATCHER_DA_TYPE: ${{ matrix.batcher_da }}
          HEMI_E2E_POST_RUN: "true"
        working-directory: ./e2e/monitor
        run: go test -timeout 30m -v -run '^TestPostRun' .

      - name: "dump logs"
        if: "always()"
        run: docker compose -f ./e2e/docker-compose.yml logs
