[package]
name = "trust"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[dependencies]
# Integration patch: pinned back to 0.32.9 to match op-reth's consensus bitcoin pin (host<->guest/Oxygen
# alignment, WU-0). The trust client source is byte-identical to the pre-V7 toni pin (91dda34) which used
# 0.32.9, so this is a no-op for the client; only the V7 server-side moved. Revert if op-reth's consensus
# bitcoin is ever coordinated up to 0.32.101 across host+guest.
bitcoin = "=0.32.9"
ethnum = "=1.5.3"
futures-util = "=0.3.32"
hex = "=0.4.3"
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
hmac = "=0.13.0"
sha2 = "=0.11.0"
rocksdb = "=0.24.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149" # integration: back to workspace/kona pin (V7 bumped to 1.0.150); client source identical
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-native-roots"] }
tokio-util = "=0.7.18"
tungstenite = "=0.29.0"
project-root = "=0.2.2"

[dev-dependencies]
tempfile = "=3.27.0"
testcontainers = "0.27.3"
rand = "0.8"
tar = "0.4.46"
walkdir = "2.5.0"
